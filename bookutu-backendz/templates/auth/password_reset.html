<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Bookutu</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/fa.min.css' %}">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full space-y-8 p-8">
        <div class="text-center">
            <div class="mx-auto h-16 w-16 bg-blue-600 rounded-full flex items-center justify-center mb-6">
                <i class="fas fa-key text-white text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-900">Forgot your password?</h2>
            <p class="mt-2 text-sm text-gray-600">Enter your account email and we'll help you reset it.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="rounded-lg p-4 {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="bg-white rounded-xl shadow-lg p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email address</label>
                    <input id="email" name="email" type="email" required autocomplete="email"
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                        class="w-full py-3 px-4 rounded-lg text-white font-semibold bg-blue-600 hover:bg-blue-700">
                    Request password reset
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-gray-600">
                Remembered it? <a href="/accounts/login/" class="text-blue-600 hover:underline">Back to sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
